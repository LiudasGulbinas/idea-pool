# Deploys the Supabase Edge Functions (Claude analysis) whenever they change on main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy functions
        run: supabase functions deploy --project-ref tciicfmrixbzyrkkjbnl --use-api
